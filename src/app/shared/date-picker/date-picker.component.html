<div class="space-y-2">
  <label class="text-sm font-semibold text-slate-700">
    {{ label }}
  </label>

  <input
    type="text"
    [formControl]="control"
    mwlFlatpickr
    [altInput]="true"
    [convertModelValue]="true"
    [locale]="thaiLocale"
    dateFormat="Y-m-d"
    altFormat="j F Y"
    (flatpickrReady)="formatThaiYear($event)"
    (flatpickrChange)="formatThaiYear($event)"
    (flatpickrMonthChange)="formatThaiYear($event)"
    (flatpickrYearChange)="formatThaiYear($event)"
    class="w-full rounded-lg border border-slate-300 px-4 py-3 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100"
  />
</div>
