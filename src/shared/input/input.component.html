<div class="space-y-2 group">
  <label
    class="flex items-center gap-1 text-sm font-bold text-slate-700 group-focus-within:text-emerald-600 transition-colors"
  >
    {{ label }}
    @if (required) {
      <span class="text-red-500 text-xs">*</span>
    }
  </label>

  <input
    [type]="type"
    [formControl]="control"
    [placeholder]="placeholder"
    [ngClass]="{
      'border-red-500 focus:border-red-500 focus:ring-red-500/10': isInvalid,
      'border-slate-300 focus:border-emerald-500 focus:ring-emerald-500/10': !isInvalid,
    }"
    class="w-full px-4 py-3 bg-white border rounded-xl text-slate-700 placeholder:text-slate-400 focus:outline-none focus:ring-4 transition-all duration-200"
  />

  <app-input-error [control]="control" [label]="label" type="input"> </app-input-error>
</div>
