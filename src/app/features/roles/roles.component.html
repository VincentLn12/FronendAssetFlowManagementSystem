<app-data-table
  title="ระบบจัดการบทบาทผู้ใช้งาน"
  subtitle="จัดการบทบาทผู้ใช้งานในระบบ"
  [data]="roles()"
  [columns]="columns"
  [idKey]="'id'"
  [isAdmin]="true"
  [sortOptions]="sortOptions"
  [totalItems]="role?.count ?? 0"
  [pageSize]="Params.pageSize"
  [currentPage]="Params.pageNumber"
  (search)="onSearch($event)"
  (sortChange)="onSort($event)"
  (pageChange)="onPageChange($event)"
  (add)="goToCreate()"
  (edit)="goToEdit($event)"
  (delete)="deleteRoles($event)"
>
</app-data-table>
