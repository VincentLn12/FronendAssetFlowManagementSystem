<app-data-table
  title="ระบบจัดการปีงบประมาณ"
  subtitle="จัดการปีงบประมาณทั้งหมดในระบบ"
  [data]="fiscalyears()"
  [columns]="columns"
  [idKey]="'fiscal_year_id'"
  [isAdmin]="true"
  [sortOptions]="sortOptions"
  [totalItems]="fiscalyear?.count ?? 0"
  [pageSize]="Params.pageSize"
  [currentPage]="Params.pageNumber"
  (search)="onSearch($event)"
  (sortChange)="onSort($event)"
  (pageChange)="onPageChange($event)"
  (add)="goToCreate()"
  (edit)="goToEdit($event)"
  (delete)="deleteFiscalyears($event)"
>
</app-data-table>
