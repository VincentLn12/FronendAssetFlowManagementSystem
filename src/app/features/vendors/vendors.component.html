<app-data-table
  title="ระบบจัดการร้านค้า"
  subtitle="จัดการร้านค้าของคุณได้อย่างง่ายดาย"
  [data]="vendors()"
  [columns]="columns"
  [idKey]="'vendor_id'"
  [isAdmin]="true"
  [sortOptions]="sortOptions"
  [totalItems]="vendor?.count ?? 0"
  [pageSize]="Params.pageSize"
  [currentPage]="Params.pageNumber"
  (search)="onSearch($event)"
  (sortChange)="onSort($event)"
  (pageChange)="onPageChange($event)"
  (add)="goToCreate()"
  (edit)="goToEdit($event)"
  (delete)="deleteVendors($event)"
>
</app-data-table>
