<app-data-table
  title="ระบบจัดการคุรุภัณฑ์ย่อย"
  subtitle="จัดการรายการคุรุภัณฑ์ย่อยทั้งหมด"
  [data]="assetsubItems()"
  [columns]="columns"
  [idKey]="'asset_sub_item_id'"
  [isAdmin]="true"
  [sortOptions]="sortOptions"
  [totalItems]="assetsubItem?.count ?? 0"
  [pageSize]="Params.pageSize"
  [currentPage]="Params.pageNumber"
  (search)="onSearch($event)"
  (sortChange)="onSort($event)"
  (pageChange)="onPageChange($event)"
  (add)="goToCreate()"
  (edit)="goToEdit($event)"
  (delete)="deleteAssetSubItems($event)"
  (back)="cancel()"
>
</app-data-table>
