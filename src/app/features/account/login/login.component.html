<div class="min-h-[85vh] flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-lg shadow-xl border border-gray-200 overflow-hidden">
    <div class="bg-blue-900 h-2"></div>
    <div class="px-8 py-10">
      <div class="text-center mb-8">
        <div
          class="mx-auto h-16 w-16 bg-blue-50 text-blue-900 rounded-full flex items-center justify-center mb-4 shadow-sm border border-blue-100"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-8 h-8"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M4.26 10.147a60.436 60.436 0 00-.491 6.347A48.627 48.627 0 0112 20.904a48.627 48.627 0 018.232-4.41 60.46 60.46 0 00-.491-6.347m--2.658-.813A59.905 59.905 0 0112 3.493a59.902 59.902 0 0110.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.697 50.697 0 0112 13.489a50.702 50.702 0 017.74-3.342M6.75 15a.75.75 0 100-1.5.75.75 0 000 1.5zm0 0v-3.675A55.378 55.378 0 0112 8.443m-7.007 11.55A5.981 5.981 0 006.75 15.75v-1.5"
            />
          </svg>
        </div>
        <h1 class="text-2xl font-bold text-gray-900 tracking-tight">University Asset Portal</h1>
        <p class="mt-2 text-sm text-gray-500 font-medium">
          Please sign in with your university account
        </p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <div>
          <label for="email" class="block text-sm font-semibold text-gray-700 mb-1"
            >Email Address</label
          >
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg
                class="h-5 w-5 text-gray-400"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 20 20"
                fill="currentColor"
                aria-hidden="true"
              >
                <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z" />
                <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" />
              </svg>
            </div>
            <input
              id="email"
              formControlName="email"
              type="email"
              placeholder="student@university.ac.th"
              class="pl-10 appearance-none block w-full px-3 py-2.5 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-900 focus:border-blue-900 sm:text-sm transition-colors"
            />
          </div>
        </div>

        <div>
          <div class="flex justify-between items-center mb-1">
            <label for="password" class="block text-sm font-semibold text-gray-700">Password</label>
            <a
              href="#"
              class="text-xs font-medium text-blue-900 hover:text-blue-800 transition-colors"
              >Forgot password?</a
            >
          </div>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg
                class="h-5 w-5 text-gray-400"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 20 20"
                fill="currentColor"
                aria-hidden="true"
              >
                <path
                  fill-rule="evenodd"
                  d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"
                  clip-rule="evenodd"
                />
              </svg>
            </div>
            <input
              id="password"
              formControlName="password"
              type="password"
              placeholder="••••••••"
              class="pl-10 appearance-none block w-full px-3 py-2.5 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-900 focus:border-blue-900 sm:text-sm transition-colors"
            />
          </div>
        </div>

        <button
          type="submit"
          [disabled]="loginForm.invalid"
          class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-md shadow-sm text-sm font-bold text-white bg-blue-900 hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-900 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200"
        >
          Sign In
        </button>
      </form>
    </div>

    <div class="bg-gray-50 px-8 py-5 text-center border-t border-gray-200">
      <p class="text-sm text-gray-600 font-medium">
        New Student / Staff?
        <a
          routerLink="/account/register"
          class="text-blue-900 hover:text-blue-800 transition-colors font-bold ml-1"
          >Create an account</a
        >
      </p>
    </div>
  </div>
</div>
