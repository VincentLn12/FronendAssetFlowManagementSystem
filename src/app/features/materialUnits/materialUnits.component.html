<app-data-table
  title="ระบบจัดการหน่วยวัสดุ"
  subtitle="จัดการประเภทหน่วยวัสดุทั้งหมดในระบบ"
  [data]="materialUnits()"
  [columns]="columns"
  [idKey]="'unit_id'"
  [isAdmin]="true"
  [sortOptions]="sortOptions"
  [totalItems]="materialUnit?.count ?? 0"
  [pageSize]="Params.pageSize"
  [currentPage]="Params.pageNumber"
  (search)="onSearch($event)"
  (sortChange)="onSort($event)"
  (pageChange)="onPageChange($event)"
  (add)="goToCreate()"
  (edit)="goToEdit($event)"
  (delete)="deleteMaterialUnits($event)"
>
</app-data-table>
