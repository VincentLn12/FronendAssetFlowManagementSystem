<app-data-table
  title="ประวัติใบเบิกวัสดุ"
  subtitle="จัดการประวัติใบเบิกวัสดุทั้งหมด"
  [data]="materialWithdrawals()"
  [columns]="columns"
  [idKey]="'material_withdrawal_id'"
  [isAdmin]="true"
  [sortOptions]="sortOptions"
  [totalItems]="materialWithdrawal?.count ?? 0"
  [pageSize]="Params.pageSize"
  [currentPage]="Params.pageNumber"
  (search)="onSearch($event)"
  (sortChange)="onSort($event)"
  (pageChange)="onPageChange($event)"
  (add)="goToCreate()"
  (edit)="goToEdit($event)"
  (delete)="deleteMaterialWithdrawal($event)"
  (back)="cancel()"
  [Namepath]="'ประวัติใบเบิกวัสดุ'"
  [showBack]="true"
  [butttonColor]="butttonColor"
  [headerColor]="headerColor"
  [headerBorderColor]="headerBorderColor"
>
</app-data-table>
