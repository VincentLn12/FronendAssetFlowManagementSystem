<app-data-table
  title="ประวัติการซ่อมบำรุงรักษาทรัพย์สิน"
  subtitle="จัดการประวัติการซ่อมบำรุงรักษาทรัพย์สิน"
  [data]="assetRepairs()"
  [columns]="columns"
  [idKey]="'asset_repair_id'"
  [isAdmin]="true"
  [sortOptions]="sortOptions"
  [totalItems]="assetRepair?.count ?? 0"
  [pageSize]="Params.pageSize"
  [currentPage]="Params.pageNumber"
  (search)="onSearch($event)"
  (sortChange)="onSort($event)"
  (pageChange)="onPageChange($event)"
  (add)="goToCreate()"
  (edit)="goToEdit($event)"
  (delete)="deleteAssetRepairs($event)"
  (back)="cancel()"
  (detail)="goToDetail($event)"
>
</app-data-table>
