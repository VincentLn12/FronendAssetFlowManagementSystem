<app-data-table
  title="ระบบจัดการประเภทหมวดเงิน"
  subtitle="จัดการประเภทหมวดเงินสำหรับการจัดซื้อจัดจ้างและบริหารสัญญา"
  [data]="fundcategorys()"
  [columns]="columns"
  [idKey]="'fund_category_id'"
  [isAdmin]="true"
  [sortOptions]="sortOptions"
  [totalItems]="fundcategory?.count ?? 0"
  [pageSize]="Params.pageSize"
  [currentPage]="Params.pageNumber"
  (search)="onSearch($event)"
  (sortChange)="onSort($event)"
  (pageChange)="onPageChange($event)"
  (add)="goToCreate()"
  (edit)="goToEdit($event)"
  (delete)="deleteFundcategorys($event)"
>
</app-data-table>
