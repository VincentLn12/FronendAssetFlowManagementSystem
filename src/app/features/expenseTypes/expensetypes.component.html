<app-data-table
  title="ระบบจัดการประเภทการเบิกจ่าย"
  subtitle="จัดการประเภทการเบิกจ่ายของระบบ"
  [data]="expensetypes()"
  [columns]="columns"
  [idKey]="'expense_type_id'"
  [isAdmin]="true"
  [sortOptions]="sortOptions"
  [totalItems]="expensetype?.count ?? 0"
  [pageSize]="Params.pageSize"
  [currentPage]="Params.pageNumber"
  (search)="onSearch($event)"
  (sortChange)="onSort($event)"
  (pageChange)="onPageChange($event)"
  (add)="goToCreate()"
  (edit)="goToEdit($event)"
  (delete)="deleteExpensetypesTypes($event)"
>
</app-data-table>
