@if (isOpen) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 px-4 py-6"
    role="dialog"
    aria-modal="true"
  >
    <div class="w-full max-w-md overflow-hidden rounded-3xl bg-white shadow-2xl">
      <div class="border-b border-slate-200 px-6 py-4">
        <div class="flex items-start justify-between gap-4">
          <div>
            <h3 class="text-lg font-semibold text-slate-900">เพิ่มบริษัท/ร้าน</h3>
            <p class="mt-1 text-sm text-slate-500">บันทึกชื่อร้านแล้วเลือกใช้งานต่อได้ทันที</p>
          </div>

          <button
            type="button"
            (click)="close.emit()"
            class="rounded-full p-2 text-slate-400 transition hover:bg-slate-100 hover:text-slate-700"
            [disabled]="isSubmitting"
            aria-label="ปิด"
          >
            ✕
          </button>
        </div>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="px-6 py-5">
          <label class="mb-2 block text-sm font-bold text-slate-700">
            ชื่อบริษัท/ร้าน
            <span class="text-xs text-red-500">*</span>
          </label>

          <input
            type="text"
            formControlName="vendor_name"
            placeholder="กรอกชื่อบริษัท/ร้าน"
            class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-slate-700 transition focus:border-emerald-500 focus:outline-none focus:ring-4 focus:ring-emerald-500/10"
          />

          @if (form.controls.vendor_name.invalid && form.controls.vendor_name.touched) {
            <p class="mt-2 text-xs text-red-500">กรุณากรอกชื่อบริษัท/ร้าน</p>
          }
        </div>

        <div class="flex flex-col-reverse gap-3 border-t border-slate-200 bg-slate-50 px-6 py-4 sm:flex-row sm:justify-end">
          <button
            type="button"
            (click)="close.emit()"
            class="inline-flex justify-center rounded-xl border border-slate-300 bg-white px-5 py-2.5 text-sm font-medium text-slate-700 transition hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-50"
            [disabled]="isSubmitting"
          >
            ยกเลิก
          </button>

          <button
            type="submit"
            class="inline-flex justify-center rounded-xl bg-emerald-700 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-emerald-800 disabled:cursor-not-allowed disabled:opacity-50"
            [disabled]="isSubmitting"
          >
            @if (isSubmitting) {
              กำลังบันทึก...
            } @else {
              เพิ่มบริษัท/ร้าน
            }
          </button>
        </div>
      </form>
    </div>
  </div>
}
