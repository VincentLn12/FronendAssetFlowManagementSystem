<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ระบบบริหารจัดการงานพัสดุ</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="institute-Logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <app-root>
      <div
        style="
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          background-color: #f9fafb;
          font-family: 'Roboto', sans-serif;
        "
      >
        <div style="text-align: center">
          <!-- Simple CSS Spinner -->
          <div
            style="
              border: 4px solid #e5e7eb;
              border-top: 4px solid #1e3a8a;
              border-radius: 50%;
              width: 50px;
              height: 50px;
              animation: spin 1s linear infinite;
              margin: 0 auto 16px auto;
            "
          ></div>
          <style>
            @keyframes spin {
              0% {
                transform: rotate(0deg);
              }
              100% {
                transform: rotate(360deg);
              }
            }
          </style>
          <h2 style="color: #1e3a8a; font-weight: 500; margin: 0">
            การพัฒนาระบบบริหารจัดการงานพัสดุและติดตามเอกสาร
          </h2>

          <p style="color: #6b7280; font-size: 14px; margin-top: 8px">กำลังโหลดระบบ...</p>
        </div>
      </div>
    </app-root>
  </body>
</html>
