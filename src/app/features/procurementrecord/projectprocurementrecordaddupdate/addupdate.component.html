<div class="min-h-screen bg-slate-50 px-4 py-4 font-sans sm:px-6 lg:px-8">
  <div class="mx-auto max-w-[1920px]">
    <button
      type="button"
      (click)="cancel()"
      class="mb-4 inline-flex items-center gap-2 text-sm font-medium text-slate-500 transition hover:text-blue-800"
    >
      <span class="text-lg leading-none">←</span>
      กลับไปหน้ารายการ
    </button>

    <div class="grid gap-5">
      <div class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
        <div class="border-b-2 border-blue-900 bg-blue-900 px-6 py-3">
          <div class="flex items-center justify-between gap-3">
            <h2 class="text-base font-semibold text-white">ข้อมูล{{ name }}</h2>

            <span
              class="inline-flex w-fit items-center rounded-full px-3 py-1 text-xs font-semibold"
              [ngClass]="
                isEditMode()
                  ? 'bg-amber-50 text-amber-700 ring-1 ring-amber-300'
                  : 'bg-blue-50 text-blue-800 ring-1 ring-blue-300'
              "
            >
              {{ isEditMode() ? 'โหมดแก้ไข' : 'โหมดเพิ่มข้อมูล' }}
            </span>
          </div>

          <p class="mt-0.5 text-sm text-blue-200">กรอกข้อมูลที่จำเป็นให้ครบถ้วนก่อนบันทึก</p>
        </div>

        @if (isLoading()) {
          <div class="space-y-4 p-6">
            <div class="h-4 w-40 animate-pulse rounded bg-slate-200"></div>
            <div class="h-11 w-full animate-pulse rounded-lg bg-slate-200"></div>
            <div class="h-10 w-48 animate-pulse rounded-lg bg-slate-200"></div>
          </div>
        } @else {
          <form [formGroup]="form" (ngSubmit)="submit()">
            <div class="grid grid-cols-1 gap-6 p-6 md:grid-cols-3">
              <app-select
                label="ปีงบประมาณ"
                [control]="form.controls.fiscal_year_id"
                [options]="fiscal_years()"
                optionLabel="fiscal_year"
                optionValue="fiscal_year_id"
                [searchable]="false"
                [clearable]="false"
              />
              <app-select
                label="รหัสโครงการ"
                [control]="form.controls.project_id"
                [options]="projects()"
                optionLabel="project_code"
                optionValue="project_id"
                placeholder="-- เลือกรหัสโครงการ --"
                [required]="true"
                [searchable]="true"
              />
              <app-select
                label="ประเภทการเบิกจ่าย"
                [control]="form.controls.expense_type_id"
                [options]="expense_types()"
                optionLabel="expense_type_name"
                optionValue="expense_type_id"
                placeholder="-- เลือกประเภทการเบิกจ่าย --"
                [required]="true"
                [searchable]="false"
              />
            </div>

            <div class="-mt-5 grid grid-cols-1 gap-6 px-6 pb-6 md:grid-cols-3">
              <app-input
                label="เลขที่เอกสาร"
                [control]="form.controls.document_no"
                placeholder="เช่น 123-456-789"
                [required]="true"
              />

              <app-select
                label="ดำเนินการ"
                [control]="form.controls.operation_type_id"
                [options]="operation_types()"
                optionLabel="operation_type_name"
                optionValue="operation_type_id"
                placeholder="-- เลือกประเภทดำเนินการ --"
                [required]="true"
                [searchable]="false"
              />

              <app-select
                label="สาขาวิชา"
                [control]="form.controls.department_id"
                [options]="departments()"
                optionLabel="department_name"
                optionValue="department_id"
                placeholder="-- เลือกสาขา --"
                [required]="true"
              />
            </div>

            <div class="-mt-5 grid grid-cols-1 gap-6 px-6 pb-6 md:grid-cols-3">
              <app-date-picker label="วันที่ตรวจรับ" [control]="form.controls.inspection_date" />

              <app-select
                label="บริษัท/ร้าน"
                [control]="form.controls.vendor_id"
                [options]="vendors()"
                optionLabel="vendor_name"
                optionValue="vendor_id"
                placeholder="-- เลือกบริษัท/ร้าน --"
                [required]="true"
              />
              <app-select
                label="หมวดเงิน"
                [control]="form.controls.fund_category_id"
                [options]="fund_categorys()"
                optionLabel="fund_name"
                optionValue="fund_category_id"
                placeholder="-- เลือกหมวดเงิน --"
                [required]="true"
                [searchable]="false"
              />
            </div>

            <div class="-mt-5 grid grid-cols-1 gap-6 px-6 pb-6 md:grid-cols-3">
              <app-select
                label="ประเภทงบประมาณ"
                [control]="form.controls.budget_source_id"
                [options]="budget_sources()"
                optionLabel="budget_source_name"
                optionValue="budget_source_id"
                placeholder="-- เลือกประเภทงบประมาณ --"
                [required]="true"
                [searchable]="false"
              />

              <app-select
                label="ผู้เบิกจ่าย"
                [control]="form.controls.staff_id"
                [options]="staffs()"
                optionLabel="full_name"
                optionValue="staff_id"
                placeholder="-- เลือกผู้เบิกจ่าย --"
              />

              <app-select
                label="สถานะ"
                [control]="form.controls.status"
                [options]="statusOptions"
                optionLabel="label"
                optionValue="value"
                [searchable]="false"
                [clearable]="false"
              />
            </div>

            <div class="-mt-5 px-6 pb-6">
              <app-input
                label="หมายเหตุ"
                [control]="form.controls.remark"
                placeholder="เช่น ตรวจรับสินค้าครบถ้วน"
              />
            </div>

            <div class="-mt-5 px-6 pb-6">
              <label class="mb-2 block text-sm font-bold text-slate-700">ไฟล์แนบ</label>

              <input
                type="file"
                (change)="onFileSelected($event)"
                class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-slate-700 transition-all duration-200 focus:border-blue-500 focus:outline-none focus:ring-4 focus:ring-blue-500/10"
              />
            </div>

            @if (isAssetType() && !this.isEditMode()) {
              <app-procurement-asset-section
                [fundCategorys]="fund_categorys()"
                [departments]="departments()"
                [acquisitionMethods]="aquisition_methods()"
                [assetCategories]="asset_category()"
                [units]="unit()"
                (payloadChange)="assetPayload.set($event)"
                (validityChange)="isAssetSectionValid.set($event)"
              />
            }
            @if (isHireType() && !this.isEditMode()) {
              <app-procurement-hire-section
                [units]="unit()"
                (payloadChange)="hirePayload.set($event)"
                (validityChange)="isHireSectionValid.set($event)"
              />
            }

            @if (isMaterialType() && !isEditMode()) {
              <app-procurement-material-section
                [materialItems]="material_items()"
                (payloadChange)="materialPayload.set($event)"
                (validityChange)="isMaterialSectionValid.set($event)"
              />
            }

            <div
              class="flex flex-col-reverse gap-3 border-t border-slate-200 bg-slate-50 px-6 py-4 sm:flex-row sm:items-center sm:justify-end"
            >
              <button
                type="button"
                (click)="cancel()"
                class="inline-flex justify-center rounded-xl border border-slate-300 bg-white px-5 py-2.5 text-sm font-medium text-slate-700 shadow-sm transition hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-50"
                [disabled]="isSubmitting()"
              >
                ยกเลิก
              </button>

              <button
                type="submit"
                class="inline-flex justify-center rounded-xl bg-blue-800 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-900 disabled:cursor-not-allowed disabled:opacity-50"
                [disabled]="
                  isSubmitting() || form.invalid || (isAssetType() && !isAssetSectionValid())
                "
              >
                @if (isSubmitting()) {
                  กำลังบันทึก...
                } @else if (isEditMode()) {
                  บันทึกการแก้ไข
                } @else {
                  บันทึกข้อมูล
                }
              </button>
            </div>
          </form>
        }
      </div>
    </div>
  </div>
</div>
