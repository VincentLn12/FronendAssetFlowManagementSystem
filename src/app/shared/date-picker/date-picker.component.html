<div class="space-y-2 group">
  <label
    class="flex items-center gap-1 text-sm font-bold text-slate-700 group-focus-within:text-emerald-600 transition-colors"
  >
    {{ label }}
  </label>

  <input
    type="text"
    [formControl]="control"
    mwlFlatpickr
    [altInput]="true"
    [convertModelValue]="true"
    [locale]="thaiLocale"
    dateFormat="Y-m-d"
    altFormat="j F Y"
    (flatpickrReady)="formatThaiYear($event)"
    (flatpickrChange)="formatThaiYear($event)"
    (flatpickrMonthChange)="formatThaiYear($event)"
    (flatpickrYearChange)="formatThaiYear($event)"
    class="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl text-slate-700 placeholder:text-slate-400 focus:outline-none focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 transition-all duration-200"
  />
</div>
