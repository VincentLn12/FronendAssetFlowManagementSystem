<app-data-table
  title="ระบบจัดการตำแหน่งบุคลากร"
  subtitle="จัดการตำแหน่งบุคลากรภายในองค์กร"
  [data]="positions()"
  [columns]="columns"
  [idKey]="'position_id'"
  [isAdmin]="true"
  [sortOptions]="sortOptions"
  [totalItems]="position?.count ?? 0"
  [pageSize]="Params.pageSize"
  [currentPage]="Params.pageNumber"
  (search)="onSearch($event)"
  (sortChange)="onSort($event)"
  (pageChange)="onPageChange($event)"
  (add)="goToCreate()"
  (edit)="goToEdit($event)"
  (delete)="deletePosition($event)"
>
</app-data-table>
