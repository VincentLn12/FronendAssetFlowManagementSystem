<app-data-table
  title="ระบบจัดการคุรุภัณฑ์"
  subtitle="จัดการรายการคุรุภัณฑ์ทั้งหมด"
  [data]="assetItems()"
  [columns]="columns"
  [idKey]="'asset_id'"
  [isAdmin]="true"
  [sortOptions]="sortOptions"
  [totalItems]="assetItem?.count ?? 0"
  [pageSize]="Params.pageSize"
  [currentPage]="Params.pageNumber"
  (search)="onSearch($event)"
  (sortChange)="onSort($event)"
  (pageChange)="onPageChange($event)"
  (add)="goToCreate()"
  (edit)="goToEdit($event)"
  (delete)="deleteAssetItems($event)"
  Namepath="ดูรายการย่อย"
  (back)="cancel()"
  (action)="onTableAction($event)"
  [showDetail]="true"
  [showPathTo]="true"
  [showBack]="true"
  [headerColor]="headerColor"
  [headerBorderColor]="headerBorderColor"
  [butttonColor]="butttonColor"
>
</app-data-table>
