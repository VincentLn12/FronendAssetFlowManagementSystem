<app-data-table
  title="ระบบจัดการคำนำหน้า"
  subtitle="จัดการข้อมูลคำนำหน้า เช่น นาย, นางสาว, นาง และอื่นๆ เพื่อให้ข้อมูลในระบบมีความถูกต้องและเป็นปัจจุบัน"
  [data]="prefixs()"
  [columns]="columns"
  [idKey]="'prefix_id'"
  [isAdmin]="true"
  [sortOptions]="sortOptions"
  [totalItems]="prefix?.count ?? 0"
  [pageSize]="Params.pageSize"
  [currentPage]="Params.pageNumber"
  (search)="onSearch($event)"
  (sortChange)="onSort($event)"
  (pageChange)="onPageChange($event)"
  (add)="goToCreate()"
  (edit)="goToEdit($event)"
  (delete)="deletePrefixes($event)"
>
</app-data-table>
