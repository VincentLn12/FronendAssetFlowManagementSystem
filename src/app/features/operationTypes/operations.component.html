<app-data-table
  title="ระบบจัดการประเภทการดำเนินงาน"
  subtitle="จัดการประเภทการดำเนินงานทั้งหมดในระบบ"
  [data]="operations()"
  [columns]="columns"
  [idKey]="'operation_type_id'"
  [isAdmin]="true"
  [sortOptions]="sortOptions"
  [totalItems]="operation?.count ?? 0"
  [pageSize]="Params.pageSize"
  [currentPage]="Params.pageNumber"
  (search)="onSearch($event)"
  (sortChange)="onSort($event)"
  (pageChange)="onPageChange($event)"
  (add)="goToCreate()"
  (edit)="goToEdit($event)"
  (delete)="deleteOperationTypes($event)"
>
</app-data-table>
