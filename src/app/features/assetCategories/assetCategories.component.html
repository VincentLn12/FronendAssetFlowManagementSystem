<app-data-table
  title="ระบบจัดการประเภทครุภัณฑ์หลัก"
  subtitle="จัดการประเภทครุภัณฑ์หลักทั้งหมดในระบบ"
  [data]="assetCategories()"
  [columns]="columns"
  [idKey]="'asset_category_id'"
  [isAdmin]="true"
  [sortOptions]="sortOptions"
  [totalItems]="assetCategorie?.count ?? 0"
  [pageSize]="Params.pageSize"
  [currentPage]="Params.pageNumber"
  (search)="onSearch($event)"
  (sortChange)="onSort($event)"
  (pageChange)="onPageChange($event)"
  (add)="goToCreate()"
  (edit)="goToEdit($event)"
  (delete)="deleteAssetCategories($event)"
>
</app-data-table>
