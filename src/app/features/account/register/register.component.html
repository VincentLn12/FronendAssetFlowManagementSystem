<div class="min-h-[85vh] flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-lg shadow-xl border border-gray-200 overflow-hidden">
    <div class="bg-blue-900 h-2"></div>
    <div class="px-8 py-10">
      <div class="text-center mb-8">
        <div
          class="mx-auto h-16 w-16 bg-blue-50 text-blue-900 rounded-full flex items-center justify-center mb-4 shadow-sm border border-blue-100"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-8 h-8"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M18 18.72a9.094 9.094 0 003.741-.479 3 3 0 00-4.682-2.72m.94 3.198l.001.031c0 .225-.012.447-.037.666A11.944 11.944 0 0112 21c-2.17 0-4.207-.576-5.963-1.584A6.062 6.062 0 016 18.719m12 0a5.971 5.971 0 00-.941-3.197m0 0A5.995 5.995 0 0012 12.75a5.995 5.995 0 00-5.058 2.772m0 0a3 3 0 00-4.681 2.72 8.986 8.986 0 003.74.477m.94-3.197a5.971 5.971 0 00-.94 3.197M15 6.75a3 3 0 11-6 0 3 3 0 016 0zm6 3a2.25 2.25 0 11-4.5 0 2.25 2.25 0 014.5 0zm-13.5 0a2.25 2.25 0 11-4.5 0 2.25 2.25 0 014.5 0z"
            />
          </svg>
        </div>
        <h1 class="text-2xl font-bold text-gray-900 tracking-tight">
          Student / Staff Registration
        </h1>
        <p class="mt-2 text-sm text-gray-500 font-medium">Create your university asset account</p>
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="firstName" class="block text-sm font-semibold text-gray-700 mb-1"
              >First Name</label
            >
            <input
              id="firstName"
              formControlName="firstName"
              type="text"
              class="appearance-none block w-full px-3 py-2.5 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-900 focus:border-blue-900 sm:text-sm transition-colors"
              placeholder="First Name"
            />
          </div>
          <div>
            <label for="lastName" class="block text-sm font-semibold text-gray-700 mb-1"
              >Last Name</label
            >
            <input
              id="lastName"
              formControlName="lastName"
              type="text"
              class="appearance-none block w-full px-3 py-2.5 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-900 focus:border-blue-900 sm:text-sm transition-colors"
              placeholder="Last Name"
            />
          </div>
        </div>

        <div>
          <label for="email" class="block text-sm font-semibold text-gray-700 mb-1"
            >University Email</label
          >
          <input
            id="email"
            formControlName="email"
            type="email"
            class="appearance-none block w-full px-3 py-2.5 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-900 focus:border-blue-900 sm:text-sm transition-colors"
            placeholder="student@university.ac.th"
          />
        </div>

        <div>
          <label for="password" class="block text-sm font-semibold text-gray-700 mb-1"
            >Password</label
          >
          <input
            id="password"
            formControlName="password"
            type="password"
            class="appearance-none block w-full px-3 py-2.5 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-900 focus:border-blue-900 sm:text-sm transition-colors"
            placeholder="••••••••"
          />
          <p class="mt-1 text-xs text-gray-500">Must be at least 8 characters</p>
        </div>

        @if (validationErrors.length > 0) {
          <div class="mt-4 p-4 bg-red-50 border-l-4 border-red-500 rounded-r-md">
            <div class="flex items-start">
              <svg
                class="h-5 w-5 text-red-500 mr-2 mt-0.5"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 20 20"
                fill="currentColor"
              >
                <path
                  fill-rule="evenodd"
                  d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-5a.75.75 0 01.75.75v4.5a.75.75 0 01-1.5 0v-4.5A.75.75 0 0110 5zm0 10a1 1 0 100-2 1 1 0 000 2z"
                  clip-rule="evenodd"
                />
              </svg>
              <div class="flex-1 text-sm text-red-700">
                <ul class="list-disc pl-4 space-y-1">
                  @for (error of validationErrors; track error) {
                    <li>{{ error }}</li>
                  }
                </ul>
              </div>
            </div>
          </div>
        }

        <button
          type="submit"
          [disabled]="registerForm.invalid"
          class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-md shadow-sm text-sm font-bold text-white bg-blue-900 hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-900 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200 mt-2"
        >
          Create Account
        </button>
      </form>
    </div>

    <div class="bg-gray-50 px-8 py-5 text-center border-t border-gray-200">
      <p class="text-sm text-gray-600 font-medium">
        Already have an account?
        <a
          routerLink="/account/login"
          class="text-blue-900 hover:text-blue-800 transition-colors font-bold ml-1"
          >Sign in</a
        >
      </p>
    </div>
  </div>
</div>
