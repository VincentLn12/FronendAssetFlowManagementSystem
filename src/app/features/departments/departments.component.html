<app-data-table
  title="ระบบจัดการสาขาวิชา"
  subtitle="จัดการข้อมูลสาขาวิชา"
  [data]="departments()"
  [columns]="columns"
  [idKey]="'department_id'"
  [isAdmin]="true"
  [sortOptions]="sortOptions"
  [totalItems]="department?.count ?? 0"
  [pageSize]="Params.pageSize"
  [currentPage]="Params.pageNumber"
  (search)="onSearch($event)"
  (sortChange)="onSort($event)"
  (pageChange)="onPageChange($event)"
  (add)="goToCreate()"
  (edit)="goToEdit($event)"
  (delete)="deleteDepartment($event)"
>
</app-data-table>
