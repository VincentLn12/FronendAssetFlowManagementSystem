<app-data-table
  title="ระบบจัดการเอกสารการจัดซื้อจัดจ้าง"
  subtitle="จัดการข้อมูลเอกสารการจัดซื้อจัดจ้าง"
  [data]="procurementrecords()"
  [columns]="columns"
  [idKey]="'procurement_record_id'"
  [isAdmin]="true"
  [sortOptions]="sortOptions"
  [filterOptions]="filterOptions()"
  [totalItems]="procurementrecord?.count ?? 0"
  [pageSize]="Params.pageSize"
  [currentPage]="Params.pageNumber"
  [fileBaseUrl]="baseFileUrl"
  [Namepath]="'ดูรายการ'"
  [showPathTo]="true"
  [showWithdraw]="true"
  [showDetail]="true"
  (search)="onSearch($event)"
  (sortChange)="onSort($event)"
  (filterChange)="onFilterChange($event)"
  (pageChange)="onPageChange($event)"
  (add)="goToCreate()"
  (edit)="goToEdit($event)"
  (delete)="deleteProcurementrecord($event)"
  (action)="onTableAction($event)"
></app-data-table>
