<app-data-table
  title="ระบบจัดการคุรุภัณฑ์"
  subtitle="จัดการรายการคุรุภัณฑ์ทั้งหมด"
  [data]="assetItems()"
  [columns]="columns"
  [idKey]="'asset_id'"
  [isAdmin]="true"
  [sortOptions]="sortOptions"
  [totalItems]="assetItem?.count ?? 0"
  [pageSize]="Params.pageSize"
  [currentPage]="Params.pageNumber"
  (search)="onSearch($event)"
  (sortChange)="onSort($event)"
  (pageChange)="onPageChange($event)"
  (add)="goToCreate()"
  (edit)="goToEdit($event)"
  (delete)="deleteAssetItems($event)"
  [To]="true"
  (pathTo)="goToAssetsubItems($event)"
  Namepath="ดูรายการย่อย"
  (back)="cancel()"
  [backs]="true"
  [Repairs]="true"
  (repair)="goToAssetRepairs($event)"
>
</app-data-table>
