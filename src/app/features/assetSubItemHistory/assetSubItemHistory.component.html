<app-data-table
  title="ระบบจัดการประวัติการใช้คุรุภัณฑ์"
  subtitle="จัดการรายการประวัติการใช้คุรุภัณฑ์ทั้งหมด"
  [data]="AssetSubItemHistorys()"
  [columns]="columns"
  [idKey]="'sub_item_history_id'"
  [isAdmin]="true"
  [sortOptions]="sortOptions"
  [totalItems]="AssetSubItemHistory?.count ?? 0"
  [pageSize]="Params.pageSize"
  [currentPage]="Params.pageNumber"
  (search)="onSearch($event)"
  (sortChange)="onSort($event)"
  (pageChange)="onPageChange($event)"
  (add)="goToCreate()"
  (edit)="goToEdit($event)"
  (delete)="deleteAssetSubItemHistory($event)"
  (back)="cancel()"
  [showBack]="true"
  [butttonColor]="butttonColor"
  [headerColor]="headerColor"
  [headerBorderColor]="headerBorderColor"
>
</app-data-table>
