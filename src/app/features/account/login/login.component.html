<div class="min-h-screen bg-slate-100 flex items-center justify-center px-4">
  <div class="w-full max-w-5xl bg-white rounded-3xl shadow-2xl overflow-hidden grid md:grid-cols-2">
    <!-- LEFT -->
    <div
      class="hidden md:flex flex-col justify-center bg-gradient-to-br from-blue-900 via-blue-800 to-slate-900 text-white p-14"
    >
      <div
        class="w-20 h-20 rounded-2xl bg-white/10 backdrop-blur flex items-center justify-center mb-8"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-10 h-10"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.5"
            d="M12 14l9-5-9-5-9 5 9 5z"
          />
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.5"
            d="M12 14l6.16-3.422A12.083 12.083 0 0120 17.5c0 1.657-3.582 3-8 3s-8-1.343-8-3a12.083 12.083 0 011.84-6.922L12 14z"
          />
        </svg>
      </div>

      <h1 class="text-4xl font-extrabold leading-tight">ระบบบริหารจัดการงานพัสดุ</h1>

      <p class="mt-6 text-blue-100 text-lg leading-relaxed">
        และติดตามเอกสารการเบิกจ่ายด้วยเว็บแอปพลิเคชัน
      </p>

      <div class="mt-10 border-l-4 border-blue-300 pl-5">
        <p class="text-xl font-semibold">คณะวิทยาศาสตร์และเทคโนโลยี</p>

        <p class="text-blue-200 mt-2">มหาวิทยาลัยราชภัฏกาญจนบุรี</p>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="flex items-center justify-center p-8 md:p-14">
      <div class="w-full max-w-md">
        <div class="mb-10">
          <h2 class="text-3xl font-bold text-slate-800">เข้าสู่ระบบ</h2>

          <p class="text-slate-500 mt-2">กรุณาเข้าสู่ระบบด้วยบัญชีผู้ใช้งาน</p>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
          <!-- EMAIL -->
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2"> อีเมล </label>

            <input
              type="email"
              formControlName="email"
              placeholder="example@kru.ac.th"
              class="w-full h-12 px-4 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-800 focus:border-blue-800 outline-none transition-all"
            />
          </div>

          <!-- PASSWORD -->
          <div>
            <div class="flex justify-between items-center mb-2">
              <label class="block text-sm font-semibold text-slate-700"> รหัสผ่าน </label>

              <a href="#" class="text-sm text-blue-800 hover:text-blue-600"> ลืมรหัสผ่าน? </a>
            </div>

            <input
              type="password"
              formControlName="password"
              placeholder="••••••••"
              class="w-full h-12 px-4 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-800 focus:border-blue-800 outline-none transition-all"
            />
          </div>

          <!-- BUTTON -->
          <button
            type="submit"
            [disabled]="loginForm.invalid"
            class="w-full h-12 rounded-xl bg-blue-900 hover:bg-blue-800 text-white font-semibold shadow-lg hover:shadow-xl transition-all disabled:opacity-50"
          >
            เข้าสู่ระบบ
          </button>
        </form>

        <div class="mt-8 text-center">
          <p class="text-sm text-slate-500">สำหรับอาจารย์ / บุคลากร / เจ้าหน้าที่</p>
        </div>
      </div>
    </div>
  </div>
</div>
