<app-data-table
  title="ระบบจัดการเเหล่งงบประมาณ"
  subtitle="จัดการแหล่งงบประมาณทั้งหมดในระบบ"
  [data]="budgetsources()"
  [columns]="columns"
  [idKey]="'budget_source_id'"
  [isAdmin]="true"
  [sortOptions]="sortOptions"
  [totalItems]="budgetsource?.count ?? 0"
  [pageSize]="Params.pageSize"
  [currentPage]="Params.pageNumber"
  (search)="onSearch($event)"
  (sortChange)="onSort($event)"
  (pageChange)="onPageChange($event)"
  (add)="goToCreate()"
  (edit)="goToEdit($event)"
  (delete)="deleteBudgetsource($event)"
>
</app-data-table>
