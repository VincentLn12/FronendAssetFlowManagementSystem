<div class="mx-4 mb-4 rounded-xl border border-purple-200 bg-purple-50 p-4">
  <div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <h2 class="text-base font-bold text-purple-900">รายการจัดจ้าง</h2>
      <p class="mt-0.5 text-sm text-purple-700">เพิ่มรายละเอียดงานจ้างในเอกสารนี้</p>
    </div>

    <button
      type="button"
      class="rounded-lg bg-purple-700 px-4 py-2 text-sm font-semibold text-white hover:bg-purple-800"
      (click)="addHireDetail()"
    >
      + เพิ่มรายการ
    </button>
  </div>

  @for (group of hireDetailForms; track $index; let i = $index) {
    <div [formGroup]="group" class="mb-3 rounded-xl border border-purple-100 bg-white p-4">
      <div class="mb-3 flex items-center justify-between border-b border-slate-100 pb-2">
        <p class="font-semibold text-slate-700">รายการที่ {{ i + 1 }}</p>

        <button
          type="button"
          class="text-sm font-semibold text-red-600 hover:text-red-800"
          (click)="removeHireDetail(i)"
        >
          ลบ
        </button>
      </div>

      <div class="grid grid-cols-1 gap-3 md:grid-cols-2 xl:grid-cols-4">
        <div class="md:col-span-2">
          <app-input
            label="รายละเอียดงานจ้าง"
            [control]="$any(group).controls.hire_name"
            placeholder="เช่น จ้างซ่อมเครื่องปรับอากาศ"
            [required]="true"
          />
        </div>

        <app-input
          label="จำนวน"
          type="number"
          [control]="$any(group).controls.quantity"
          [required]="true"
        />

        <app-select
          label="หน่วยนับ"
          [control]="$any(group).controls.unit_id"
          [options]="units"
          optionLabel="unit_name"
          optionValue="unit_id"
          placeholder="เลือกหน่วยนับ"
        />

        <app-input
          label="ราคาต่อหน่วย"
          type="number"
          [control]="$any(group).controls.unit_price"
          [required]="true"
        />

        <app-input
          label="รวมเงิน"
          type="number"
          [control]="$any(group).controls.total_amount"
          [readonly]="true"
        />

        <div class="md:col-span-2 xl:col-span-2">
          <app-input
            label="จำนวนเงินตัวอักษร"
            [control]="$any(group).controls.total_text"
            [readonly]="true"
          />
        </div>
      </div>
    </div>
  }
</div>
