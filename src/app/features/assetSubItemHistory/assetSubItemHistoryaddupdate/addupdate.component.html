<div class="min-h-screen bg-slate-50 px-4 py-4 sm:px-6 lg:px-8 font-sans">
  <div class="mx-auto max-w-[1920px]">
    <!-- Back button -->
    <button
      type="button"
      (click)="cancel()"
      class="mb-4 inline-flex items-center gap-2 text-sm font-medium text-slate-500 hover:text-blue-800 transition"
    >
      <span class="text-lg leading-none">←</span>
      กลับไปหน้ารายการ
    </button>

    <!-- Content -->
    <div class="grid gap-5">
      <div class="rounded-2xl border border-slate-200 bg-white shadow-sm overflow-hidden">
        <!-- Header -->
        <div class="border-b-2 border-blue-900 bg-blue-900 px-6 py-3">
          <div class="flex justify-between items-center gap-3">
            <h2 class="text-base font-semibold text-white">ข้อมูล{{ name }}</h2>

            <span
              class="inline-flex w-fit items-center rounded-full px-3 py-1 text-xs font-semibold"
              [ngClass]="
                isEditMode()
                  ? 'bg-amber-50 text-amber-700 ring-1 ring-amber-300'
                  : 'bg-blue-50 text-blue-800 ring-1 ring-blue-300'
              "
            >
              {{ isEditMode() ? 'โหมดแก้ไข' : 'โหมดเพิ่มข้อมูล' }}
            </span>
          </div>

          <p class="mt-0.5 text-sm text-blue-200">
            กรอกข้อมูลประวัติการใช้ครุภัณฑ์ให้ครบถ้วนก่อนบันทึก
          </p>
        </div>

        @if (isLoading()) {
          <div class="space-y-4 p-6">
            <div class="h-4 w-40 animate-pulse rounded bg-slate-200"></div>
            <div class="h-11 w-full animate-pulse rounded-lg bg-slate-200"></div>
            <div class="h-10 w-48 animate-pulse rounded-lg bg-slate-200"></div>
          </div>
        } @else {
          <form [formGroup]="form" (ngSubmit)="submit()">
            <!-- แถวที่ 1 -->
            <div class="grid grid-cols-1 gap-6 p-6 md:grid-cols-3">
              <app-input
                label="รหัสการเบิก"
                type="number"
                [readonly]="true"
                [control]="form.controls.procurement_withdrawal_id"
                placeholder="รหัสการเบิก"
                [required]="true"
              ></app-input>

              <app-date-picker
                label="วันที่ทำรายการ"
                [control]="form.controls.history_date"
                placeholder="เลือกวันที่ทำรายการ"
              ></app-date-picker>

              <app-input
                label="ประเภทประวัติ"
                [control]="form.controls.history_type"
                placeholder="เช่น ใช้งาน / ย้ายที่ตั้ง / ส่งซ่อม / คืน / จำหน่าย"
                [required]="true"
              ></app-input>
            </div>

            <!-- แถวที่ 2 -->
            <div class="grid grid-cols-1 gap-6 px-6 pb-6 md:grid-cols-2">
              <app-select
                label="ประเภทการใช้งานครุภัณฑ์"
                [control]="form.controls.usage_type_id"
                [options]="AssetUsage()"
                optionLabel="usage_type_name"
                optionValue="usage_type_id"
                placeholder="-- เลือกประเภทการใช้งาน --"
                [required]="true"
                [searchable]="true"
              />

              <app-input
                label="รายละเอียด"
                [control]="form.controls.detail"
                placeholder="เช่น ใช้งานประจำห้องปฏิบัติการ / ย้ายไปอาคาร 2"
              ></app-input>
            </div>

            <!-- Footer -->
            <div
              class="flex flex-col-reverse gap-3 border-t border-slate-200 bg-slate-50 px-6 py-4 sm:flex-row sm:items-center sm:justify-end"
            >
              <button
                type="button"
                (click)="cancel()"
                class="inline-flex justify-center rounded-xl border border-slate-300 bg-white px-5 py-2.5 text-sm font-medium text-slate-700 shadow-sm hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-50 transition"
                [disabled]="isSubmitting()"
              >
                ยกเลิก
              </button>

              <button
                type="submit"
                class="inline-flex justify-center rounded-xl bg-blue-800 px-5 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-blue-900 disabled:cursor-not-allowed disabled:opacity-50 transition"
                [disabled]="isSubmitting() || form.invalid"
              >
                @if (isSubmitting()) {
                  กำลังบันทึก...
                } @else if (isEditMode()) {
                  บันทึกการแก้ไข
                } @else {
                  บันทึกข้อมูล
                }
              </button>
            </div>
          </form>
        }
      </div>
    </div>
  </div>
</div>
